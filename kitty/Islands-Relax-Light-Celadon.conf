## name: Islands Relax Light Celadon
## author: Islands Relax Light Celadon theme contributors
## license: MIT
## upstream: https://github.com/panxiaoan/falcon-jetbrains-themes
## blurb: A gentle celadon light theme derived from Falcon's JetBrains theme

# Core colors
foreground                      #383a42
background                      #e4ecef

# Cursor and selection
cursor                          #067d17
cursor_text_color               #fafeff
selection_foreground            #383a42
selection_background            #afdbb8

# URLs and visual bell
url_color                       #1a536e
visual_bell_color               #f6d4c8

# Window borders
active_border_color             #70a6ae
inactive_border_color           #d3dcdf
bell_border_color               #ce5e5e

# Tabs mirror the Islands UI chrome
tab_bar_background              #c4dee4
active_tab_foreground           #1a536e
active_tab_background           #e4ecef
active_tab_font_style           bold
inactive_tab_foreground         #5a5d6b
inactive_tab_background         #cedee2
inactive_tab_font_style         normal
tab_bar_margin_color            #c4dee4

# Marks
mark1_foreground                #383a42
mark1_background                #c2e6e2
mark2_foreground                #383a42
mark2_background                #f6d4c8
mark3_foreground                #383a42
mark3_background                #fde8b1

# Scrollbar
scrollbar_handle_color          #aeb3c2
scrollbar_track_color           #d3dcdf

# ANSI colors. The nominal white slots are intentionally dark enough to stay
# readable on the Celadon background, as is customary for a light terminal
# palette.
color0                          #383a42
color1                          #ce5e5e
color2                          #067d17
color3                          #9e880d
color4                          #174ad4
color5                          #871790
color6                          #007297
color7                          #5a5d6b

color8                          #8c8c8c
color9                          #ef233c
color10                         #30a25e
color11                         #cc9d57
color12                         #397fb7
color13                         #a35cf0
color14                         #62b3b3
color15                         #27282e
